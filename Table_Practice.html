<html>
<head>
    <title>Table Practice</title>
</head>
<style>
    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-image: url(https://tse2.mm.bing.net/th/id/OIP.eqpzE4bw3AeP658vlTOqZQAAAA?cb=12&rs=1&pid=ImgDetMain&o=7&rm=3);
    }
    table{
        border-collapse: collapse;
        margin: auto;
    }
    td{
        border: 11px solid rgb(14, 128, 90);
        background-color: aquamarine;
        padding: 50px 10vh;
        font-size: 2vmax;
        text-align: center;
    }
    th{
        border: 11px dashed blue;
        background-color: aqua;
        padding: 10px 10vh;
        font-size: 1vmax;
        text-align: center;
        
    }
    h1{
        font-size: 7vh;
        text-align: center;
        text-shadow: 20px 20px 50px purple,
        20px 20px 50px purple,
        20px 20px 50px purple,
        20px 20px 50px purple,
        20px 20px 50px purple;
    }
    ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        position: fixed;
        height: max-content;
        width: 100%;
        background-color: black;
        top: 0;
        color: aliceblue;
    }
    a{
        display: block;
        color: white;
        padding: 20px 100px;
        text-decoration: none;
        font-size: 8vh;
    }
    a:hover{
        background-color: aqua;
        padding: 20px 100px;
        color: green;
        font-size: 8vh;
    }
</style>
<body>
    <h1 style="margin-top: 15vh;">Wednesday Sched</h1>
    <ul>
        <li><a>lalalalala</a></li>
        <li><a>ungabunga</a></li>
        <li><a>skibidi</a></li>

    </ul>
    <table>
        <tr>
            <th>Time</th>
            <th>Agenda</th>
            <th>Visual</th>
        </tr>
        <tr>
            <td>7:30-9:00 AM</td>
            <td>Alianti</td>
            <td><img src="https://clashroyale.inbox.supercell.com/9jtsgmsiuthj/45Rd2o6r5KBo1vfYi0T3ZX/61a1b8dec513c3387e7bdd75933e5e13/executionerevolution.png" alt="Evo Executioner" style="height: 9em; width: 8.5em;"></td>
            
        </tr>
        <tr>
            <td>9:10-10:40 AM</td>
            <td>Himig Agham</td>
            <td style="padding: 150px 10vh;"><img src="https://raw.githubusercontent.com/tomasdmacalintal/CS3_1stQtrPortfolio/main/assets/images/selfie.jpg" alt="Selfie" style="border-radius: 50px;"></td>
        </tr>
    </table>
</body>
</html>
